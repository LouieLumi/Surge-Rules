name: Validate Surge rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check rule syntax, coverage and configuration
        run: python3 scripts/check_rules.py
      - name: Test rule semantics and routing examples
        run: python3 -m unittest discover -s tests -v
