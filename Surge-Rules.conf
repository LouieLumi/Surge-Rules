# 仅用于替换现有配置的 [Rule] 段；保留你的 [General]、[Proxy]、[Proxy Group] 等其它配置。
# 策略组名称沿用现有配置。分类顺序有意保留“具体服务优先于通用大类”。
[Rule]
# > 原有本地应用规则
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/ApplicationDirect,DIRECT
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/ApplicationReject,REJECT,no-resolve

# > 异地组网（原样保留）
AND,((NOT,((SUBNET,ROUTER:192.168.3.1))), (IP-CIDR,192.168.3.0/24,no-resolve)),🍀 望京组网
AND,((NOT,((SUBNET,ROUTER:192.168.5.2))), (IP-CIDR,192.168.5.0/24,no-resolve)),🍀 望京组网
AND,((NOT,((SUBNET,ROUTER:192.168.0.1))), (IP-CIDR,192.168.0.0/24,no-resolve)),🍀 望京组网
AND,((NOT,((SUBNET,ROUTER:192.168.22.3))), (IP-CIDR,192.168.22.0/24,no-resolve)),🍀 辽宁组网
AND,((NOT,((SUBNET,ROUTER:192.168.31.1))), (IP-CIDR,192.168.31.0/24,no-resolve)),🍀 北京组网

# > 苹果服务（含 Apple Intelligence）
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Apple.list,"🍎 苹果服务",update-interval=3600

# > Claude
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Claude.list,"👾 人工智能",update-interval=3600

# > OpenAI / ChatGPT / Sora
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/OpenAI.list,"👾 人工智能",update-interval=3600

# > 其他人工智能
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/OtherAI.list,"👾 人工智能",update-interval=3600

# > 电报信息
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Telegram.list,"📲 电报信息",update-interval=3600

# > 游戏平台（Epic / Sony / Steam / Nintendo）
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Games.list,"🎮 游戏平台",update-interval=3600

# > YouTube / YouTube Music
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/YouTube.list,"📹 油管视频",update-interval=3600

# > 奈飞视频
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Netflix.list,"🎥 奈飞视频",update-interval=3600

# > 迪士尼
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Disney.list,"🎬 迪士尼+",update-interval=3600

# > 哔哩哔哩（含国际版）
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/BiliBili.list,"📽 哔哩哔哩",update-interval=3600

# > 其他国外媒体
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/GlobalMedia.list,"🍿 国外媒体",update-interval=3600

# > 其他国内媒体
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/ChinaMedia.list,"🍔 国内媒体",update-interval=3600

# > Gemini / Google
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Gemini.list,"👾 人工智能",update-interval=3600

# > 微软服务
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Microsoft.list,"Ⓜ️ 微软服务",update-interval=3600

# > 通用代理兜底
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/Proxy.list,"✨ 星链网络",update-interval=3600

# > 局域网兜底
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/LAN.list,DIRECT,update-interval=3600

# > 中国 ASN 直连兜底
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/ChinaASN.list,DIRECT,update-interval=3600

# > 国内域名 / 应用补全
RULE-SET,https://raw.githubusercontent.com/LouieLumi/Surge-Rules/main/rules/ChinaDomain.list,DIRECT,update-interval=3600

# > 国内 IP 兜底
GEOIP,CN,DIRECT

# Cloudflare 服务域名由 OtherAI 匹配；不按整个 AS13335 网络分流。

# > DNS 查询失败也走 Final
FINAL,✨ 星链网络,dns-failed
